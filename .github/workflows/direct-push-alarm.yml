name: Direct Push Alarm

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  detect-direct-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const shortSha = sha.slice(0, 7);
            const commitUrl = `https://github.com/${owner}/${repo}/commit/${sha}`;
            const commitResponse = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: sha,
            });
            const message = commitResponse.data.commit.message;
            const pusher = context.actor;
            const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: sha,
            });
            const mergedPr = associated.data.find((pullRequest) => pullRequest.merged_at);

            if (mergedPr) {
              core.info(`Commit ${shortSha} is associated with merged PR #${mergedPr.number}.`);
              return;
            }

            const labelName = 'direct-push';
            let labelAvailable = false;
            try {
              const labelsResponse = await github.rest.issues.listLabelsForRepo({
                owner,
                repo,
                per_page: 100,
              });
              labelAvailable = labelsResponse.data.some((label) => label.name === labelName);
              if (!labelAvailable) {
                try {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: labelName,
                    color: 'd73a4a',
                    description: 'Detected push to main without a merged pull request',
                  });
                  labelAvailable = true;
                } catch (error) {
                  if (error.status === 422) {
                    const refreshedLabels = await github.rest.issues.listLabelsForRepo({
                      owner,
                      repo,
                      per_page: 100,
                    });
                    labelAvailable = refreshedLabels.data.some((label) => label.name === labelName);
                  } else {
                    core.warning(`Could not create the ${labelName} label: ${error.message}`);
                  }
                }
              }
            } catch (error) {
              core.warning(`Could not verify the ${labelName} label: ${error.message}`);
            }

            const messageQuote = message.split('\n').map((line) => `> ${line}`).join('\n');
            const issueBody = [
              `**Pusher:** @${pusher}`,
              `**Commit:** [${shortSha}](${commitUrl})`,
              '',
              '**Commit message:**',
              messageQuote,
            ].join('\n');
            const summary = core.summary
              .addHeading('Direct push detected')
              .addTable([
                [{ data: 'Pusher', header: true }, pusher],
                [{ data: 'Commit', header: true }, `[${shortSha}](${commitUrl})`],
                [{ data: 'Message', header: true }, message],
              ]);

            let issue;
            try {
              const issueResponse = await github.rest.issues.create({
                owner,
                repo,
                title: `Direct push to main: ${shortSha}`,
                body: issueBody,
                labels: labelAvailable ? [labelName] : [],
              });
              issue = issueResponse.data;
              summary.addLink(`Issue #${issue.number}`, issue.html_url);
            } catch (error) {
              core.warning(`Could not create a direct-push issue: ${error.message}`);
              summary.addRaw(`\nIssue creation failed: ${error.message}\n`);
              await summary.write();
              core.setFailed(`Direct push ${shortSha} detected; creating its issue failed.`);
              return;
            }

            await summary.write();
            core.setFailed(`Direct push ${shortSha} detected. See issue #${issue.number}.`);
