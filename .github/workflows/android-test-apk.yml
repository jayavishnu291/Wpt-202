name: Android Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: dev
      EXPO_PUBLIC_BLOCKING_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install --clean
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: wpt202a-dev-test-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
